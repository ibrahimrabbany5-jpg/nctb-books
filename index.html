            { title: "Dakhil 9-10 Hadith", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/16Ny-zthsZXKfz1i29XUV6-JePXNGdBLa/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=16Ny-zthsZXKfz1i29XUV6-JePXNGdBLa" },
            { title: "Dakhil 9-10 Fiqh", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1CfB0DhO_x-pkL4g6bunxkY-hwL-EUlXB/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1CfB0DhO_x-pkL4g6bunxkY-hwL-EUlXB" },
            { title: "Dakhil 9-10 Islamer Etihas", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1N6nMPiIs9G1mOzDhs12l3_0HTZU3SizM/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1N6nMPiIs9G1mOzDhs12l3_0HTZU3SizM" },
            { title: "Dakhil 9-10 Qawaid", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1kf65FGda0wW9ybi_-sNXAuyWqrNgr2Y0/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1kf65FGda0wW9ybi_-sNXAuyWqrNgr2Y0" },
            { title: "Dakhil 9-10 Physical Edu", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1CSHOiUsin1IqYZlLClJqvQH10B4q63nG/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1CSHOiUsin1IqYZlLClJqvQH10B4q63nG" },
            { title: "Dakhil 9-10 Arabic", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1MoRVOKng5jbev7b_SVU6zyEaj6Qlxxn6/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1MoRVOKng5jbev7b_SVU6zyEaj6Qlxxn6" },
            { title: "Dakhil 9-10 Higher Math", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1gHXlop-7mec9lAsqdMrbJsXGQQVqet0F/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1gHXlop-7mec9lAsqdMrbJsXGQQVqet0F" },
            { title: "Dakhil 9-10 Biology", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1Yy3GAY12VFpG87pWNzQg9ZNNikKmnjO8/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1Yy3GAY12VFpG87pWNzQg9ZNNikKmnjO8" },
            { title: "Dakhil 9-10 Chemistry", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1VIkQf2yts_Jn_-GhwAUhxy-yBLIjRD0O/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1VIkQf2yts_Jn_-GhwAUhxy-yBLIjRD0O" },
            { title: "Dakhil 9-10 Physics", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1KYz0jXcbn9BHOWSVxHXRU0eLa5-3XL5I/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1KYz0jXcbn9BHOWSVxHXRU0eLa5-3XL5I" },
            { title: "Dakhil 9-10 Agriculture", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1Z2JbLKLBi2NAIVbjJoP576ruve_-UTj2/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1Z2JbLKLBi2NAIVbjJoP576ruve_-UTj2" },
            { title: "Dakhil 9-10 Civics", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1-Aw567us6YRL2BufXZObBPKz8EYoVm9i/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1-Aw567us6YRL2BufXZObBPKz8EYoVm9i" },
            { title: "Dakhil 9-10 Math", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1S7aYr-thNgpF_vEQNisI6rhUoqmZl_z2/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1S7aYr-thNgpF_vEQNisI6rhUoqmZl_z2" },
            { title: "Dakhil 9-10 BGS", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1jkMQ-rEIi7wX0AcEM3Ng-7nJvo4ychFo/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1jkMQ-rEIi7wX0AcEM3Ng-7nJvo4ychFo" },
            { title: "Dakhil 9-10 Bangla Bakaron", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1qd3l_lprVMzhvqMJa9poc_B9yFAqqIV-/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1qd3l_lprVMzhvqMJa9poc_B9yFAqqIV-" },
            { title: "Dakhil 9-10 ICT", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1ALcHo4MscOMySKhJiTrPBO-486ghBHLt/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1ALcHo4MscOMySKhJiTrPBO-486ghBHLt" },
            { title: "Dakhil 9-10 English Grammar", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1-yfNeaYj_qIeLI_RuEF78RUt35uoHoln/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1-yfNeaYj_qIeLI_RuEF78RUt35uoHoln" },
            { title: "Dakhil 9-10 Bangla Sahitto", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1ggtFEz7l1kmymSwUT4kgnkpo6DPLeeFw/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1ggtFEz7l1kmymSwUT4kgnkpo6DPLeeFw" },
            { title: "Dakhil 9-10 English for Today", stream: "madrasah", level: "secondary", classId: "dakhil9", viewUrl: "https://drive.google.com/file/d/1q95GybgaIy1QnR7h2_WSZra4hnp618ok/view?usp=drivesdk", downloadUrl: "https://drive.google.com/uc?export=download&id=1q95GybgaIy1QnR7h2_WSZra4hnp618ok" }
        ];

        let processedBooks = booksData.map(b => {
            const driveId = getDriveId(b.viewUrl);
            const coverUrl = driveId ? `https://drive.google.com/thumbnail?id=${driveId}&sz=w500` : '';
            return { ...b, title: b.title.replace(/_compressed\.pdf|\.pdf/gi, ''), coverUrl };
        });

        let currentStream = 'school';
        let currentLevel = 'secondary';
        let currentClass = 'class6';

        const classMapping = {
            school: {
                preprimary: [{ id: 'pre', name: 'প্রাক-প্রাথমিক' }],
                primary: [
                    { id: 'class1', name: '১ম শ্রেণি' },
                    { id: 'class2', name: '২য় শ্রেণি' },
                    { id: 'class3', name: '৩য় শ্রেণি' },
                    { id: 'class4', name: '৪র্থ শ্রেণি' },
                    { id: 'class5', name: '৫ম শ্রেণি' }
                ],
                secondary: [
                    { id: 'class6', name: '৬ষ্ঠ শ্রেণি' },
                    { id: 'class7', name: '৭ম শ্রেণি' },
                    { id: 'class8', name: '৮ম শ্রেণি' },
                    { id: 'class9', name: '৯ম-১০ম শ্রেণি' }
                ],
                highersecondary: [
                    { id: 'class11', name: 'একাদশ-দ্বাদশ শ্রেণি' }
                ]
            },
            madrasah: {
                preprimary: [{ id: 'mpre', name: 'ইবতেদায়ী প্রাক-প্রাথমিক' }],
                primary: [
                    { id: 'ebt1', name: 'ইবতেদায়ী ১ম শ্রেণি' },
                    { id: 'ebt2', name: 'ইবতেদায়ী ২য় শ্রেণি' },
                    { id: 'ebt3', name: 'ইবতেদায়ী ৩য় শ্রেণি' },
                    { id: 'ebt4', name: 'ইবতেদায়ী ৪র্থ শ্রেণি' },
                    { id: 'ebt5', name: 'ইবতেদায়ী ৫ম শ্রেণি' }
                ],
                secondary: [
                    { id: 'dakhil6', name: 'দাখিল ৬ষ্ঠ' },
                    { id: 'dakhil7', name: 'দাখিল ৭ম' },
                    { id: 'dakhil8', name: 'দাখিল ৮ম' },
                    { id: 'dakhil9', name: 'দাখিল ৯ম-১০ম' }
                ],
                highersecondary: [
                    { id: 'alim1', name: 'আলিম ১ম ও ২য় বর্ষ' }
                ]
            }
        };

        function setStream(stream) {
            currentStream = stream;
            document.getElementById('btn-stream-school').className = stream === 'school' ? 'px-6 sm:px-10 py-3 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 bg-emerald-700 text-white shadow-md' : 'px-6 sm:px-10 py-3 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 text-slate-600 hover:bg-slate-100';
            document.getElementById('btn-stream-madrasah').className = stream === 'madrasah' ? 'px-6 sm:px-10 py-3 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 bg-emerald-700 text-white shadow-md' : 'px-6 sm:px-10 py-3 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 text-slate-600 hover:bg-slate-100';
            
            setLevel(currentLevel);
        }

        function setLevel(level) {
            currentLevel = level;
            
            document.querySelectorAll('.level-tab').forEach(tab => {
                if(tab.getAttribute('data-level') === level) {
                    tab.className = "level-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold border bg-emerald-700 text-white border-emerald-700 shadow-md transition duration-200";
                } else {
                    tab.className = "level-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold border bg-white text-slate-700 border-slate-300 hover:bg-slate-100 transition duration-200";
                }
            });

            const classes = classMapping[currentStream][currentLevel];
            if(classes && classes.length > 0) {
                currentClass = classes[0].id;
            } else {
                currentClass = '';
            }

            renderClassButtons();
        }

        function renderClassButtons() {
            const container = document.getElementById('class-buttons');
            container.innerHTML = '';
            
            const classes = classMapping[currentStream][currentLevel];
            if(classes && classes.length > 0) {
                classes.forEach((cls) => {
                    const btn = document.createElement('button');
                    btn.className = `px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer ${cls.id === currentClass ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200'}`;
                    btn.innerText = cls.name;
                    btn.onclick = () => {
                        currentClass = cls.id;
                        renderClassButtons();
                    };
                    container.appendChild(btn);
                });
            }
            filterBooks();
        }

        function filterBooks() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('books-container');
            container.innerHTML = '';

            const filtered = processedBooks.filter(b => {
                const matchSearch = b.title.toLowerCase().includes(searchVal);
                if (searchVal !== '') {
                    return matchSearch;
                }
                return b.stream === currentStream && b.level === currentLevel && b.classId === currentClass;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-sm font-medium">এই শ্রেণিতে কোনো বই পাওয়া যায়নি।</div>`;
                return;
            }

            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl p-3 sm:p-4 flex flex-col justify-between shadow-sm hover:shadow-xl transition-all duration-300 group hover:-translate-y-1";
                card.innerHTML = `
                    <div>
                        <div class="h-44 sm:h-52 bg-slate-100 rounded-xl mb-3 overflow-hidden border border-slate-100 shadow-inner relative flex items-center justify-center">
                            <img src="${book.coverUrl}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=PDF+Book';">
                            <span class="absolute top-2 right-2 text-[10px] font-bold bg-black/65 backdrop-blur-sm text-white px-2.5 py-0.5 rounded-md shadow">PDF</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs sm:text-sm mb-2 line-clamp-2 leading-snug">${book.title}</h4>
                    </div>
                    <div class="flex items-center gap-1.5 mt-3 pt-2.5 border-t border-slate-100">
                        <button onclick="openModal('${book.viewUrl}', '${book.title}', '${book.downloadUrl}')" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] sm:text-xs py-2 rounded-xl font-bold transition text-center cursor-pointer shadow-sm">ভিউ (View)</button>
                        <a href="${book.downloadUrl}" target="_blank" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] sm:text-xs py-2 rounded-xl font-bold transition text-center">ডাউনলোড</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(url, title, downloadUrl) {
            document.getElementById('modal-book-title').innerText = title;
            let embedUrl = url.replace('/view?usp=drivesdk', '/preview').replace('/view?usp=sharing', '/preview').replace('/view', '/preview');
            document.getElementById('pdf-iframe').src = embedUrl;
            document.getElementById('modal-download-btn').href = downloadUrl;
            document.getElementById('pdf-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-iframe').src = '';
        }

        // Initialize Load
        setLevel('secondary');
    </script>
</body>
</html>
