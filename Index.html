      background-color: #f8fafc;
      color: #0f172a;
    }

    .nctb-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nctb-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(2, 132, 199, 0.15);
    }

    .custom-table th {
      background-color: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    .custom-table td {
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body class="p-2 sm:p-4 md:p-6">

    </header>

      <div id="breadcrumbContent" class="flex items-center flex-wrap gap-2">
        <!-- Dynamically Populated -->
      </div>
    </nav>

    <!-- Main Dynamic Content Area -->
    <main class="p-4 sm:p-6 min-h-[500px]">
      
      <!-- View 1: Main Levels Grid -->
      <div id="viewLevels" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered via JS -->
      </div>

      <!-- View 2: Class Category Comparison Table -->
      <div id="viewTable" class="hidden overflow-x-auto">
        <h2 id="tableTitle" class="text-xl font-bold mb-4 text-slate-800 border-l-4 border-sky-600 pl-3"></h2>
        <table class="custom-table w-full text-center text-sm sm:text-base border-collapse">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- View 3: Subject & Book List Table -->
      <div id="viewBooks" class="hidden overflow-x-auto">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
          <h2 id="booksTitle" class="text-xl font-bold text-slate-800 border-l-4 border-sky-600 pl-3"></h2>
          <span id="bookCountBadge" class="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full border border-sky-200"></span>
        </div>
        <table class="custom-table w-full text-center text-sm sm:text-base border-collapse">
          <thead>
            <tr>
              <th class="w-16 py-3">ক্রমিক</th>
              <th class="text-left px-4 py-3">পাঠ্যপুস্তকের নাম</th>
              <th class="w-48 sm:w-64 py-3">পড়ুন ও ডাউনলোড</th>
            </tr>
          </thead>
          <tbody id="booksTableBody"></tbody>
        </table>
      </div>

      <!-- View 4: PDF Viewer Container -->
      <div id="viewPdf" class="hidden border border-slate-300 rounded-lg overflow-hidden bg-slate-900 shadow-xl">
        <div class="bg-slate-800 text-white px-4 py-3 flex flex-wrap justify-between items-center gap-3 border-b border-slate-700">
          <div class="flex items-center gap-2">
            <span class="text-xl">📖</span>
            <span id="pdfBookTitle" class="font-bold text-base sm:text-lg text-slate-100"></span>
          </div>
          <div class="flex items-center gap-3">
            <a id="pdfDownloadBtn" href="#" target="_blank" download class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-bold text-xs sm:text-sm inline-flex items-center gap-2 transition-colors">
              <span>📥</span> ডাউনলোড ফাইল
            </a>
          </div>
        </div>
        <div class="w-full h-[650px] bg-slate-800 flex items-center justify-center">
          <iframe id="pdfFrame" class="w-full h-full border-none" src="" title="PDF Viewer"></iframe>
        </div>
      </div>

    </main>

            ]},
            "alim": { classLabel: "আলিম ১ম ও ২য় বর্ষ", books: [
              { name: "আল কুরআন মাজীদ", pdf: "https://nctb.portal.gov.bd/", download: "https://nctb.portal.gov.bd/" },
              { name: "আল হাদীস শরীফ", pdf: "https://nctb.portal.gov.bd/", download: "https://nctb.portal.gov.bd/" }
            ]}
          }
        ]
      }
    };

    // Active Application Navigation State
    let appState = {
      levelKey: null,
      colKey: null,
      classLabel: null,
      bookName: null,
      pdfUrl: null,
      downloadUrl: null
    };

    // Render 1: Main Levels Grid View
    function renderLevelsView() {
      appState = { levelKey: null, colKey: null, classLabel: null, bookName: null, pdfUrl: null, downloadUrl: null };
      updateBreadcrumb();

      hideAllViews();
      const viewLevels = document.getElementById("viewLevels");
      viewLevels.classList.remove("hidden");

      let html = "";
      Object.keys(nctbData).forEach(levelKey => {
        const item = nctbData[levelKey];
        html += `
          <div onclick="navigateToLevel('${levelKey}')" class="nctb-card bg-white p-6 rounded-xl border border-slate-200 cursor-pointer text-center flex flex-col items-center justify-between group hover:border-sky-500">
            <div>
              <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">${item.icon}</div>
              <h3 class="text-xl font-bold text-slate-800 mb-2 group-hover:text-sky-600">${item.title}</h3>
              <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">${item.description}</p>
            </div>
            <button class="mt-6 w-full py-2 px-4 bg-sky-50 text-sky-700 font-bold rounded-lg group-hover:bg-sky-600 group-hover:text-white transition-colors text-sm">
              শ্রেণি ও শাখা নির্বাচন করুন →
            </button>
          </div>
        `;
      });

      viewLevels.innerHTML = html;
    }

    // Render 2: NCTB Matrix Table View
    function navigateToLevel(levelKey) {
      appState.levelKey = levelKey;
      appState.colKey = null;
      appState.classLabel = null;
      appState.bookName = null;
      updateBreadcrumb();

      hideAllViews();
      const viewTable = document.getElementById("viewTable");
      viewTable.classList.remove("hidden");

      const levelObj = nctbData[levelKey];
      document.getElementById("tableTitle").innerText = `${levelObj.title} - শাখা ও শ্রেণিভিত্তিক তালিকা`;
      
      // Table Header
      let headHtml = "<tr>";
      levelObj.columns.forEach(colKey => {
        headHtml += `<th class="py-3 px-4 text-slate-700 font-bold">${levelObj.columnNames[colKey]}</th>`;
      });
      headHtml += "</tr>";
      document.getElementById("tableHead").innerHTML = headHtml;

      // Table Body Rows
      let bodyHtml = "";
      levelObj.rows.forEach(row => {
        bodyHtml += "<tr class='hover:bg-sky-50/50 transition-colors'>";
        levelObj.columns.forEach(colKey => {
          const cell = row[colKey];
          if (cell) {
            bodyHtml += `
              <td class="py-3 px-4">
                <button onclick="navigateToBooks('${levelKey}', '${colKey}', '${cell.classLabel}')" class="text-sky-700 hover:text-sky-900 font-bold underline decoration-sky-300 hover:decoration-sky-600 transition-colors">
                  ${cell.classLabel}
                </button>
              </td>
            `;
          } else {
            bodyHtml += `<td class="py-3 px-4 text-slate-400 font-normal">-</td>`;
          }
        });
        bodyHtml += "</tr>";
      });

      document.getElementById("tableBody").innerHTML = bodyHtml;
    }

    // Render 3: Books List View
    function navigateToBooks(levelKey, colKey, classLabel) {
      appState.levelKey = levelKey;
      appState.colKey = colKey;
      appState.classLabel = classLabel;
      appState.bookName = null;
      updateBreadcrumb();

      hideAllViews();
      const viewBooks = document.getElementById("viewBooks");
      viewBooks.classList.remove("hidden");

      const levelObj = nctbData[levelKey];
      const colName = levelObj.columnNames[colKey];
      document.getElementById("booksTitle").innerText = `${colName} - ${classLabel}-এর পাঠ্যপুস্তকসমূহ`;

      let booksList = [];
      levelObj.rows.forEach(row => {
        if (row[colKey] && row[colKey].classLabel === classLabel) {
          booksList = row[colKey].books || [];
        }
      });

      document.getElementById("bookCountBadge").innerText = `মোট বিষয়: ${booksList.length} টি`;

      const tbody = document.getElementById("booksTableBody");
      
      if (booksList.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="py-10 text-center text-slate-500 bg-slate-50">
              <p class="text-lg">⚠️ এই শ্রেণি বা শাখার বইসমূহ দ্রুত যুক্ত করা হচ্ছে।</p>
            </td>
          </tr>
        `;
        return;
      }

      let html = "";
      booksList.forEach((b, idx) => {
        const safePdf = b.pdf ? b.pdf : "https://nctb.portal.gov.bd/";
        const safeDl = b.download ? b.download : "https://nctb.portal.gov.bd/";
        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 font-semibold text-slate-600">${idx + 1}</td>
            <td class="py-3 px-4 text-left font-bold text-slate-800">${b.name}</td>
            <td class="py-3 px-4">
              <div class="flex items-center justify-center gap-2">
                <button onclick="navigateToPdf('${levelKey}', '${colKey}', '${classLabel}', '${b.name}', '${safePdf}', '${safeDl}')" class="bg-sky-600 hover:bg-sky-700 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded transition-colors inline-flex items-center gap-1">
                  📖 পড়ুন
                </button>
                <a href="${safeDl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded transition-colors inline-flex items-center gap-1 no-underline">
                  📥 ডাউনলোড
                </a>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // Render 4: PDF View
    function navigateToPdf(levelKey, colKey, classLabel, bookName, pdfUrl, downloadUrl) {
      appState.levelKey = levelKey;
      appState.colKey = colKey;
      appState.classLabel = classLabel;
      appState.bookName = bookName;
      appState.pdfUrl = pdfUrl;
      appState.downloadUrl = downloadUrl;
      updateBreadcrumb();

      hideAllViews();
      const viewPdf = document.getElementById("viewPdf");
      viewPdf.classList.remove("hidden");

      document.getElementById("pdfBookTitle").innerText = `${classLabel} : ${bookName}`;
      
      const frame = document.getElementById("pdfFrame");
      frame.src = pdfUrl;
      
      const dlBtn = document.getElementById("pdfDownloadBtn");
      dlBtn.href = downloadUrl;
    }

    // Utility: Hide All Views
    function hideAllViews() {
      document.getElementById("viewLevels").classList.add("hidden");
      document.getElementById("viewTable").classList.add("hidden");
      document.getElementById("viewBooks").classList.add("hidden");
      document.getElementById("viewPdf").classList.add("hidden");
      document.getElementById("pdfFrame").src = "";
    }

    // Dynamic Breadcrumb Generator
    function updateBreadcrumb() {
      const container = document.getElementById("breadcrumbContent");
      let html = `<span onclick="renderLevelsView()" class="cursor-pointer hover:underline text-sky-800 font-bold">🏠 হোম</span>`;

      if (appState.levelKey) {
        const levelObj = nctbData[appState.levelKey];
        html += `<span class="text-slate-400 font-normal">/</span>`;
        if (appState.colKey || appState.bookName) {
          html += `<span onclick="navigateToLevel('${appState.levelKey}')" class="cursor-pointer hover:underline text-sky-700">${levelObj.title}</span>`;
        } else {
          html += `<span class="text-slate-600 font-normal">${levelObj.title}</span>`;
        }
      }

      if (appState.colKey && appState.classLabel) {
        const levelObj = nctbData[appState.levelKey];
        const colName = levelObj.columnNames[appState.colKey];
        html += `<span class="text-slate-400 font-normal">/</span>`;
        if (appState.bookName) {
          html += `<span onclick="navigateToBooks('${appState.levelKey}', '${appState.colKey}', '${appState.classLabel}')" class="cursor-pointer hover:underline text-sky-700">${colName} (${appState.classLabel})</span>`;
        } else {
          html += `<span class="text-slate-600 font-normal">${colName} (${appState.classLabel})</span>`;
        }
      }

      if (appState.bookName) {
        html += `<span class="text-slate-400 font-normal">/</span>`;
        html += `<span class="text-slate-800 font-bold">${appState.bookName}</span>`;
      }

      container.innerHTML = html;
    }

    // Run on Page Load
    window.addEventListener("DOMContentLoaded", renderLevelsView);
  </script>
</body>
</html>
